service: identity
database: identity_db
scopes:
- name: api
  resource: baseforge-api
clients:
- clientId: prokantar-app
  public: true
  grants:
  - password
  - otp
  - refresh_token
  scopes:
  - api
- clientId: tracking-service
  public: false
  grants:
  - client_credentials
  scopes:
  - api
roles:
- SuperAdmin
- TenantAdmin
- Operator
- Driver
registration:
  enabled: true
  defaultRole: User
  selfAssignableRoles:
  - Driver
providers: {}
multiTenancy:
  enabled: true
  adminRole: TenantAdmin
  memberRoles:
  - Operator
  requireApproval: true
  approverRoles:
  - SuperAdmin
otp:
  enabled: true
  codeLength: 6
  lifetimeSeconds: 180
  maxAttempts: 5
  resendCooldownSeconds: 60
  maxPerHour: 5
  defaultCountryCode: +90
messaging:
  emailProvider: Log
  smsProvider: Log
  smtp:
    port: 587
    fromName: ProKantar
passwordReset:
  enabled: false
  tokenLifetimeHours: 2
  cooldownSeconds: 60
accessTokenLifetimeMinutes: 60
dockerPorts:
  rest: 8081
  grpc: 8082
  postgres: 5432
