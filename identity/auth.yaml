service: identity
database: identity_db
scopes:
- name: api
  resource: baseforge-api
clients:
- clientId: prokantar-app
  public: true
  grants:
  - password
  - refresh_token
  scopes:
  - api
- clientId: tracking-service
  public: false
  grants:
  - client_credentials
  scopes:
  - api
roles:
- SuperAdmin
- TenantAdmin
- Operator
- Driver
registration:
  enabled: false
  defaultRole: User
providers: {}
dockerPorts:
  rest: 8081
  grpc: 8082
  postgres: 5432
