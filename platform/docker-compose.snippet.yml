# Bu bloğu kök docker-compose.yml'a ekleyin (postgres servisinin yanına).
# Merkezi log toplama (Grafana Loki + Grafana): workspace'teki ../observability klasörü.
services:
  platform-service:
    build: .
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=prokantar_platform_db;Username=baseforge;Password=change_me"
    depends_on:
      postgres:
        condition: service_healthy
