# kantar — izole test ortamı: servis + kendi PostgreSQL'i (mevcut DB'ye dokunmaz).
# Ayağa kaldır:  docker compose up --build -d
# API arayüzü:   http://localhost:8083/scalar/v1
# Durdur+temizle: docker compose down -v
# RabbitMq'ya bağlanır: kökteki docker-compose.yml'daki paylaşılan broker
# (bir kere 'docker compose up -d rabbitmq' — bu servis kendi RabbitMq container'ını açmaz).
# Merkezi log toplama (Grafana Loki + Grafana) workspace'teki ../observability klasöründedir
# (orada 'docker compose up -d'; Grafana: http://localhost:3000) — bu klasörün .env'indeki LOKI_URL
# (ör. http://host.docker.internal:3100) ile açılır; boşsa/erişilemezse servis sadece konsola loglamaya devam eder, bu bir ön koşul değildir.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: baseforge
      # Gerçek değer bu klasördeki .env'de (gitignore'lu, üretici rastgele oluşturur).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
      POSTGRES_DB: prokantar_kantar_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseforge -d prokantar_kantar_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5433:5432"   # yalnızca bu makineden (yerel 'dotnet run' için); dış ağa açılmaz
    volumes:
      - kantar-pgdata:/var/lib/postgresql/data

  kantar:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Loki isteğe bağlı: ../observability çalışırken .env'e LOKI_URL=http://host.docker.internal:3100 yazın; boşsa yalnız konsol.
      Serilog__LokiUrl: ${LOKI_URL:-}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=prokantar_kantar_db;Username=baseforge;Password=${POSTGRES_PASSWORD}"
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD .env dosyasinda tanimli olmali}
      Auth__ServiceClient__ClientSecret: ${Auth__ServiceClient__ClientSecret:-}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:3000}
      # Şoföre giden irsaliye linkinin web adresi: {WebUrl}/irsaliye/{token} (giriş istemez, 30 gün geçerli).
      WaybillLinks__WebUrl: ${WEB_URL:-http://localhost:3000}
      # Prod'da: Identity'nin gerçek adresi ve onun Auth__Issuer değeri (yedek issuer — Identity yeniden
      # başlarken oluşabilecek 401'leri önler). Boşsa Program.cs'deki varsayılan/metadata kullanılır.
      # Auth__Authority: "https://identity.ornek.com"
      # Auth__Issuer: "https://identity.ornek.com/"
    ports:
      - "8083:8080"   # REST (HTTP/1.1) — appsettings.json Kestrel:Endpoints:Http
      - "8084:8081"   # gRPC (h2c, TLS'siz HTTP/2)  — Kestrel:Endpoints:Grpc
    volumes:
      - kantar-uploads:/app/wwwroot/uploads   # MediaController'ın kaydettiği dosyalar — container recreate'te kaybolmasın
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kantar-pgdata:
  kantar-uploads:
