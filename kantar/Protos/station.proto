syntax = "proto3";

option csharp_namespace = "Kantar.Grpc";

package kantar;

// BaseForge.CodeGen tarafından üretildi — Station entity'sine diğer servislerin
// salt-okunur gRPC erişimi. Servis adı (StationService), C# implementasyon sınıfıyla
// (StationGrpcService) çakışmasın diye ayrı tutulur.
service StationService {
  rpc GetById (StationByIdRequest) returns (StationMessage);
}

message StationByIdRequest {
  string id = 1;
}

message StationMessage {
  string id = 1;
  string name = 2;
  string code = 3;
  string address = 4;
  string phone = 5;
  string latitude = 6;
  string longitude = 7;
  int32 radius_m = 8;
  bool is_active = 9;
}
