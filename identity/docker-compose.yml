# identity merkez auth — izole test (servis + kendi PostgreSQL'i).
#   docker compose up --build -d   ·   discovery: http://localhost:8081/.well-known/openid-configuration
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: baseforge
      # Gerçek değer bu klasördeki .env'de (gitignore'lu, üretici rastgele oluşturur).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
      POSTGRES_DB: identity_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseforge -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"   # yalnızca bu makineden (yerel 'dotnet run' için); dış ağa açılmaz
    volumes:
      - identity-pgdata:/var/lib/postgresql/data

  identity:
    build: .
    env_file:
      - .env   # gerçek secret'lar (Auth__Providers__*__ClientSecret, Auth__SeedAdmin__Password, ...)
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Auth__Issuer: "http://identity:8080/"
      Cors__AllowedOrigins__0: "http://localhost:3000"   # ProKantarUI (yerel)
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=identity_db;Username=baseforge;Password=${POSTGRES_PASSWORD}"
    ports:
      - "8081:8080"   # REST/OpenIddict (HTTP/1.1)
      - "8082:8081"   # gRPC (h2c) — merkez User entity'sine erişim
    volumes:
      - identity-avatars:/app/wwwroot/uploads   # profil fotoğrafları — container recreate'te kaybolmasın
      - identity-documents:/app/data/tenant-documents   # şirket belgeleri (gizli, wwwroot dışında)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  identity-pgdata:
  identity-avatars:
  identity-documents:
