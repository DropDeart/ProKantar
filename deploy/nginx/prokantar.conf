# ProKantar — /etc/nginx/sites-available/prokantar.conf (sites-enabled'a bağlanır). SSL'i certbot ekler:
#   certbot --nginx -d prokantar.com.tr -d www.prokantar.com.tr -d identity.prokantar.com.tr -d kantar.prokantar.com.tr \
#           -d platform.prokantar.com.tr -d tracking.prokantar.com.tr -d log.prokantar.com.tr
# Servis portları deploy/docker-compose.server.yml ile aynı (yalnız 127.0.0.1).

limit_req_zone $binary_remote_addr zone=pk_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pk_api:10m rate=20r/s;

map $http_upgrade $pk_connection_upgrade {
    default upgrade;
    ''      close;
}

# Ortak proxy başlıkları (WebSocket/SignalR dahil)
# (snippet yerine her blokta tekrar: tek dosyada kalsın)

server {
    listen 80;
    listen [::]:80;
    server_name prokantar.com.tr www.prokantar.com.tr;

    # Kapalı test: arama motorları dizinlemesin (canlı açılışta kaldırın).
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8409;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name identity.prokantar.com.tr;
    client_max_body_size 12m;   # şirket belgeleri (10 MB)

    location ~ ^/(connect/token|api/account/(login|register|otp|phone|forgot-password|reset-password|external)) {
        limit_req zone=pk_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=pk_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name kantar.prokantar.com.tr;
    client_max_body_size 5m;

    location / {
        limit_req zone=pk_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8403;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name platform.prokantar.com.tr;
    client_max_body_size 12m;

    # Şoför uygulaması SignalR hub'ı (WebSocket)
    location /hubs/ {
        proxy_pass http://127.0.0.1:8405;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pk_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        limit_req zone=pk_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8405;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tracking.prokantar.com.tr;

    location / {
        # Konum gönderimleri sık: yalnız geniş bir taşma sınırı.
        limit_req zone=pk_api burst=200 nodelay;
        proxy_pass http://127.0.0.1:8407;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pk_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Grafana (loglar): giriş Grafana'nın admin hesabıyla; Loki dışarı açılmaz.
server {
    listen 80;
    listen [::]:80;
    server_name log.prokantar.com.tr;

    location / {
        limit_req zone=pk_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8410;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pk_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
