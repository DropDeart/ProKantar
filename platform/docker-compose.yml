# platform — izole test ortamı: servis + kendi PostgreSQL'i (mevcut DB'ye dokunmaz).
# Ayağa kaldır:  docker compose up --build -d
# API arayüzü:   http://localhost:8085/scalar/v1
# Durdur+temizle: docker compose down -v
# Merkezi log toplama (Grafana Loki + Grafana) workspace'teki ../observability klasöründedir
# (orada 'docker compose up -d'; Grafana: http://localhost:3000) — bu klasörün .env'indeki LOKI_URL
# (ör. http://host.docker.internal:3100) ile açılır; boşsa/erişilemezse servis sadece konsola loglamaya devam eder, bu bir ön koşul değildir.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: baseforge
      # Gerçek değer bu klasördeki .env'de (gitignore'lu, üretici rastgele oluşturur).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
      POSTGRES_DB: prokantar_platform_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseforge -d prokantar_platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5434:5432"   # yalnızca bu makineden (yerel 'dotnet run' için); dış ağa açılmaz
    volumes:
      - platform-pgdata:/var/lib/postgresql/data

  platform:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Loki isteğe bağlı: ../observability çalışırken .env'e LOKI_URL=http://host.docker.internal:3100 yazın; boşsa yalnız konsol.
      Serilog__LokiUrl: ${LOKI_URL:-}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=prokantar_platform_db;Username=baseforge;Password=${POSTGRES_PASSWORD}"
      Auth__ServiceClient__ClientSecret: ${Auth__ServiceClient__ClientSecret:-}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:3000}
      # Davet SMS'i (Netgsm toplu SMS) ve davet linkinin web adresi; .env'den. Şifre boşsa SMS log'a yazılır.
      Netgsm__Usercode: ${Netgsm__Usercode:-}
      Netgsm__Password: ${Netgsm__Password:-}
      Netgsm__MsgHeader: ${Netgsm__MsgHeader:-}
      Invitations__WebUrl: ${Invitations__WebUrl:-http://localhost:3000}
      # Paylaşılan RabbitMQ (kantar/WaybillIssued olayı → şoför bildirim zinciri); şifre kökteki broker ile aynı.
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD .env dosyasinda tanimli olmali}
      # Prod'da: Identity'nin gerçek adresi ve onun Auth__Issuer değeri (yedek issuer — Identity yeniden
      # başlarken oluşabilecek 401'leri önler). Boşsa Program.cs'deki varsayılan/metadata kullanılır.
      # Auth__Authority: "https://identity.ornek.com"
      # Auth__Issuer: "https://identity.ornek.com/"
    ports:
      - "8085:8080"   # REST (HTTP/1.1) — appsettings.json Kestrel:Endpoints:Http
      - "8086:8081"   # gRPC (h2c, TLS'siz HTTP/2)  — Kestrel:Endpoints:Grpc
    volumes:
      - platform-uploads:/app/wwwroot/uploads   # MediaController'ın kaydettiği dosyalar — container recreate'te kaybolmasın
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  platform-pgdata:
  platform-uploads:
