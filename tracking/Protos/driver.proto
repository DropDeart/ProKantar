syntax = "proto3";

option csharp_namespace = "Platform.Grpc";

package platform;

// platform/Protos/driver.proto kopyası (istemci). Platform yeniden üretilirse buradan da güncelleyin.
service DriverService {
  rpc GetById (DriverByIdRequest) returns (DriverMessage);
}

message DriverByIdRequest {
  string id = 1;
}

message DriverMessage {
  string id = 1;
  string user_id = 2;
  string full_name = 3;
  string phone = 4;
  string national_id = 5;
  string license_no = 6;
  string kvkk_consent_at = 7;
  bool location_consent = 8;
  bool is_active = 9;
}
