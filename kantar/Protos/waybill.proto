syntax = "proto3";

option csharp_namespace = "Kantar.Grpc";

package kantar;

// BaseForge.CodeGen tarafından üretildi — Waybill entity'sine diğer servislerin
// salt-okunur gRPC erişimi. Servis adı (WaybillService), C# implementasyon sınıfıyla
// (WaybillGrpcService) çakışmasın diye ayrı tutulur.
service WaybillService {
  rpc GetById (WaybillByIdRequest) returns (WaybillMessage);
}

message WaybillByIdRequest {
  string id = 1;
}

message WaybillMessage {
  string id = 1;
  string waybill_no = 2;
  string waybill_type = 3;
  string issued_at = 4;
  string delivery_address = 5;
  string e_despatch_uuid = 6;
  string e_despatch_status = 7;
  string erp_sync_status = 8;
  string erp_doc_no = 9;
  string erp_synced_at = 10;
  string erp_error = 11;
}
