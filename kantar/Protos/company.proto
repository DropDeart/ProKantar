syntax = "proto3";

option csharp_namespace = "Kantar.Grpc";

package kantar;

// BaseForge.CodeGen tarafından üretildi — Company entity'sine diğer servislerin
// salt-okunur gRPC erişimi. Servis adı (CompanyService), C# implementasyon sınıfıyla
// (CompanyGrpcService) çakışmasın diye ayrı tutulur.
service CompanyService {
  rpc GetById (CompanyByIdRequest) returns (CompanyMessage);
}

message CompanyByIdRequest {
  string id = 1;
}

message CompanyMessage {
  string id = 1;
  string name = 2;
  string short_name = 3;
  string tax_no = 4;
  string tax_office = 5;
  bool is_customer = 6;
  bool is_supplier = 7;
  bool is_carrier = 8;
  string phone = 9;
  string email = 10;
  string address = 11;
  bool is_active = 12;
}
